# Revisión automática de cada PR contra main.
#   - Revisión crítica de ESLint, build y revisión completa de ESLint: si
#     alguna falla, el PR queda en rojo. Los avisos (warnings) no lo bloquean.
# No usa claves ni se conecta a ninguna base: el build no necesita app/.env.local.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint critico (bloquea)
        run: npm run lint:critico

      - name: Build (bloquea)
        run: npm run build

      - name: ESLint completo (bloquea)
        run: npm run lint
